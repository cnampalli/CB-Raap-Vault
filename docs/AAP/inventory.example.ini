# ===========================================================================
# Example inventory for firewall-connectivity.yml (--tags remote).
#
# [connectivity_sources] holds the hosts you want the checks to run FROM —
# not the hosts you are checking. This is how you validate a flow whose source
# is not the machine you are sitting on.
#
# The managed nodes need NO Python and NO agent. ansible.builtin.script streams
# the checker over the existing SSH connection; only bash is required there.
#
# Usage:
#   ansible-playbook -i inventory.example.ini firewall-connectivity.yml --tags remote
#   ansible-playbook -i inventory.example.ini firewall-connectivity.yml --tags remote \
#       -e apps=ci        # only check the CI controllers, from these sources
# ===========================================================================

[connectivity_sources]
# Vault nodes — the source of flow #1 (Vault -> CI /oidc/**) and flow #9
# (Vault -> SIEM). These two flows CANNOT be validated from anywhere else.
vault-01.corp.example.com
vault-02.corp.example.com
vault-03.corp.example.com

# CI agents — source of flow #2 (CI -> Vault) and the container-signing egress
# to Venafi TPP / Harbor / Prisma.
ci-agent-01.corp.example.com
ci-agent-signer-01.corp.example.com

# CD/RO servers and agents — source of flow #3 (CD/RO -> Vault).
cdro-01.corp.example.com

[connectivity_sources:vars]
ansible_user=svc_conncheck
; Key-based auth only. This account needs no privilege beyond logging in and
; running bash — the checker makes outbound connections and nothing else.
ansible_ssh_private_key_file=~/.ssh/id_conncheck
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
