ill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">7. Route to healthy local node</text><path d="M780,361 L944,361" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="865.0" y="351.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">8. Fetch credential (never shown)</text><path d="M780,399 L1114,399" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="950.0" y="389.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">9. Connect with credential</text><path d="M780,437 L106,437" fill="none" stroke="#3D4B5C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3D4B5C)"/><text x="440.0" y="427.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">10. Isolated, recorded session</text><path d="M780,475 L944,475" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="865.0" y="465.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">11. Upload recording at session end</text></svg>