xt-anchor="middle" dominant-baseline="middle">1. ssh user@account@target@psmp</text><path d="M270,133 L434,133" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="355.0" y="123.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">2. Route to healthy local node</text><path d="M440,171 L106,171" fill="none" stroke="#3D4B5C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3D4B5C)"/><text x="270.0" y="161.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">3. Authenticate: AD + MFA-caching key</text><path d="M440,209 L106,209" fill="none" stroke="#3D4B5C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3D4B5C)"/><text x="270.0" y="199.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">4. Prompt: ticketing system, ticket ID</text><path d="M100,247 L434,247" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="270.0" y="237.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">5. Ticket ID</text><path d="M440,285 L604,285" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="525.0" y="275.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">6. Validate ticket</text><path d="M610,323 L774,323" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="695.0" y="313.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">7. Check ticket</text><path d="M780,361 L616,361" fill="none" stroke="#3D4B5C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3D4B5C)"/><text x="695.0" y="351.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">8. Allowed</text><path d="M610,399 L446,399" fill="none" stroke="#3D4B5C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3D4B5C)"/><text x="525.0" y="389.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">9. Result</text><path d="M440,437 L944,437" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="695.0" y="427.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">10. Fetch credential</text><path d="M440,475 L1114,475" fill="none" stroke="#3D4B5C" stroke-width="1.4" marker-end="url(#a3D4B5C)"/><text x="780.0" y="465.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">11. SSH with credential</text><path d="M440,513 L106,513" fill="none" stroke="#3D4B5C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3D4B5C)"/><text x="270.0" y="503.0" font-family="Segoe UI, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="normal" fill="#3D4B5C" text-anchor="middle" dominant-baseline="middle">12. Recorded session</text></svg>