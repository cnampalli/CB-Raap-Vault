# ===========================================================================
# targets.conf — connectivity catalog for conn_check.sh
#
# Seeded from this repo's firewall matrix:
#   vault-integrations/00-architecture-overview.md  §4  (flows #1–#10)
#   vault-integrations/05-operations-appendix.md    §1
#   container-signing/02-signing-agent-build.md     §2  (signing-agent egress)
#
# Hostnames below are the repo-wide placeholders (*.corp.example.com).
# Replace them with your real endpoints — do NOT commit real hostnames or IPs
# if this repo is shared outside the Automation team.
#
# ---------------------------------------------------------------------------
# FORMAT — pipe-delimited. Blank lines and lines starting with # are ignored.
# Whitespace around fields is trimmed, so you may align columns freely.
# Use "-" for any field you want left unset.
#
#   TARGET | app | hosts | ports | checks | http_path | expect_status | env | owner | notes
#           1     2       3       4        5           6               7     8       9
#
#     app            grouping key; filter with --app
#     hosts          comma-separated; expands as hosts x ports
#     ports          comma-separated
#     checks         any of dns,tcp,tls,http  (default: dns,tcp)
#     http_path      path for the http check (default /)
#     expect_status  comma-separated acceptable codes (default: any 2xx/3xx)
#     env            filter with --env
#     owner          who to call when it fails
#     notes          free text (no "|")
#
#   HOP | name | user@via-host[:port] | apps | notes
#         1      2                      3      4
#
#     Runs the checks FROM via-host over SSH. Use this for any flow whose
#     SOURCE is not the machine you are sitting on — flows #1 and #9 below
#     originate on a Vault node, so they cannot be validated any other way.
#
# TLS/HTTP note: the http check uses https when "tls" is in the checks list
# (or the port is 443/8443), otherwise plain http.
# ===========================================================================


# --- Vault (destination of flows #2, #3, #3b, #6, #7, #10) ------------------
# /v1/sys/health is unauthenticated. Its status code encodes cluster state:
# 200 active, 429 standby, 472 DR secondary, 473 perf standby, 501 uninitialised,
# 503 sealed. All of them prove the path is open, so all are accepted.
TARGET|vault|vault-vip.corp.example.com|8200|dns,tcp,tls,http|/v1/sys/health|200,429,472,473,501,503|prod|Vault team|Flows #2/#3/#7/#10 — Vault API VIP
TARGET|vault|vault-01.corp.example.com,vault-02.corp.example.com,vault-03.corp.example.com|8200|dns,tcp,tls|-|-|prod|Vault team|Per-node API — catches a VIP that hides one dead node
TARGET|vault|vault-01.corp.example.com,vault-02.corp.example.com,vault-03.corp.example.com|8201|dns,tcp|-|-|prod|Vault team|Raft cluster port — node-to-node only, expect REFUSED from outside

# --- CloudBees CI (destination of flows #1 and #4) --------------------------
# Flow #1 is the classic failure: Vault pulls each controller's JWKS to validate
# JWTs. Its SOURCE is a Vault node, so run it with --hop flow1-vault-to-ci.
TARGET|ci|ci-ctrl-01.corp.example.com,ci-ctrl-02.corp.example.com|443|dns,tcp,tls,http|/oidc/.well-known/openid-configuration|200|prod|Automation|Flow #1 — OIDC discovery. Run via --hop from a Vault node.
TARGET|ci|ci-ctrl-01.corp.example.com|443|dns,tcp,tls,http|/login|200,403|prod|Automation|Flow #4 (fallback) — CDRO triggers the broker job over REST

# --- CloudBees CD/RO (destination of flow #5) -------------------------------
TARGET|cdro|cdro.corp.example.com|443,8443|dns,tcp,tls|-|-|prod|Release Eng|Flow #5 (fallback) — CI returns the wrapping token to CD/RO

# --- Ansible Automation Platform -------------------------------------------
TARGET|aap|aap.corp.example.com|443|dns,tcp,tls,http|/api/controller/v2/ping/|200|prod|Automation|CDRO -> AAP job-template launch (EC-AnsibleTower)

# --- Managed nodes (flow #8) ------------------------------------------------
TARGET|nodes|node-01.corp.example.com,node-02.corp.example.com|22|dns,tcp|-|-|prod|Automation|Flow #8 — SSH from AAP EEs / CI agents using signed certs

# --- SIEM (flow #9) ---------------------------------------------------------
# Source is a Vault node — run via --hop flow9-vault-to-siem.
TARGET|siem|siem-collector.corp.example.com|514,6514|dns,tcp|-|-|prod|SecOps|Flow #9 — Vault audit stream (6514 = syslog over TLS)

# --- Container signing egress (container-signing guide 02 §2) ---------------
TARGET|tpp|tpp.corp.example.com|443|dns,tcp,tls,http|/vedauth/|200,301,302,401,404|prod|PKI team|Venafi CodeSign — grant acquisition/refresh/revocation
TARGET|tpp|tpp.corp.example.com|443|dns,tcp,tls,http|/vedhsm/|200,301,302,401,404|prod|PKI team|Venafi virtual HSM — signing operations
TARGET|harbor|harbor.corp.example.com|443|dns,tcp,tls,http|/api/v2.0/health|200|prod|Platform|Image and signature push/pull
TARGET|prisma|prisma-console.corp.example.com|443|dns,tcp,tls|-|-|prod|CloudSec|twistcli scan target

# --- Sandbox equivalents ----------------------------------------------------
TARGET|tpp|tpp-sandbox.corp.example.com|443|dns,tcp,tls|-|-|sandbox|PKI team|Venafi sandbox
TARGET|harbor|harbor-sandbox.corp.example.com|443|dns,tcp,tls|-|-|sandbox|Platform|Harbor sandbox


# ===========================================================================
# HOPS — flows whose source is NOT the box you are running on.
# Requires key-based SSH (BatchMode) to the via-host. The script is streamed
# over the SSH connection; nothing is written to the via-host's disk.
# ===========================================================================

HOP|flow1-vault-to-ci|svc_conncheck@vault-01.corp.example.com|ci|Flow #1 — Vault must reach each CI controller /oidc/** for JWKS. The most commonly missed rule.
HOP|flow9-vault-to-siem|svc_conncheck@vault-01.corp.example.com|siem|Flow #9 — Vault audit stream to the SIEM collector
HOP|vault-to-prisma|svc_conncheck@vault-01.corp.example.com|prisma|Vault VM -> Prisma Cloud console
HOP|signing-agent-egress|svc_conncheck@ci-agent-signer-01.corp.example.com|tpp,harbor,prisma|All container-signing egress from a signing agent
HOP|aap-ee-to-vault|svc_conncheck@aap-ee-01.corp.example.com|vault|Flow #7 — AAP execution environment to Vault
